name: CodeQL

# GitHub's security analysis for the TypeScript code: injection, unsafe data flows, leaked
# secrets in code. Free for public repositories. Results appear under Security → Code scanning.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # Mondays, to catch newly published vulnerability patterns

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
